name: Release

# Push a tag like v0.1.0 (it must match the "Version:" line in wpflatfiles.php) and this attaches an installable zip to a GitHub release.
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: wpflatfiles

      - name: Check the tag matches the plugin version
        run: |
          V=$(grep -m1 '^ \* Version:' wpflatfiles/wpflatfiles.php | awk '{print $3}')
          if [ "v$V" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Version: $V in wpflatfiles.php" >&2
            exit 1
          fi
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - name: Build the zip (the plugin folder, without development files)
        run: |
          zip -rq "wpflatfiles-$VERSION.zip" wpflatfiles \
            -x "wpflatfiles/.git/*" "wpflatfiles/.github/*" "wpflatfiles/.gitignore" "wpflatfiles/ui/*" "wpflatfiles/vite*.js" "wpflatfiles/package*.json" "wpflatfiles/API.md" \
               "wpflatfiles/node_modules/*" "wpflatfiles/lib/dompdf/tests/*" '*.DS_Store'
          cp "wpflatfiles-$VERSION.zip" wpflatfiles.zip   # a stable name, so .../releases/latest/download/wpflatfiles.zip always works
          unzip -l wpflatfiles.zip | tail -1

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            wpflatfiles-${{ env.VERSION }}.zip
            wpflatfiles.zip
          generate_release_notes: true
